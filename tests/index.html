<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Minimasters tests</title>
  <style>
    body { font: 14px/1.5 system-ui, sans-serif; margin: 16px; background: #fafaf7; color: #222; }
    .pass { color: #1f7a3a; }
    .fail { color: #b3261e; font-weight: 600; white-space: pre-wrap; }
    #summary { font-size: 18px; font-weight: 700; }
    pre { background: #eee; padding: 8px; overflow-x: auto; }
  </style>
</head>
<body>
  <div id="summary">running…</div>
  <div id="out"></div>
  <script type="module">
    import { run } from './runner.js';
    import { SUITES } from './suites.js';
    const out = document.getElementById('out');
    for (const file of SUITES) await import('./' + file);
    const { pass, fail, reports } = await run((r) => {
      const div = document.createElement('div');
      div.className = r.ok ? 'pass' : 'fail';
      div.textContent = (r.ok ? '✓ ' : '✗ ') + r.name + (r.ok ? '' : '\n' + r.error);
      out.appendChild(div);
    });
    for (const text of reports) {
      const pre = document.createElement('pre');
      pre.textContent = text;
      out.appendChild(pre);
    }
    const sum = document.getElementById('summary');
    sum.textContent = `${pass} passed, ${fail} failed`;
    sum.className = fail ? 'fail' : 'pass';
    window.__results = { pass, fail };
  </script>
</body>
</html>
